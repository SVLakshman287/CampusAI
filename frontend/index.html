<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusAI - Smart Campus Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎓 CampusAI</h1>

        <p class="subtitle">
            Smart Campus Assistant
        </p>

        <p>
            Hello! How can I help you today?
        </p>

        <textarea
            id="question"
            placeholder="Ask about attendance, exams, fees, hostel, certificates..."
            rows="5">
        </textarea>

        <button id="askButton">
            Ask CampusAI
        </button>

        <div class="response-box">

            <h3>CampusAI Response</h3>

            <p id="response">
                Your answer will appear here.
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
